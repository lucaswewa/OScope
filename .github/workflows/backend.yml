name: Backend
on:
  pull_request:
    paths:
      - Cargo.*
      - .cargo/**
      - crates/**
      - configs/**
      - examples/**
      - xtask/**
      - deny.toml
      - rust-toolchain.toml
      - containers/**
      - compose*.yaml
      - .dockerignore
      - scripts/check-backend.sh
      - scripts/check-cpu.sh
      - scripts/check-gpu.sh
      - scripts/check-pipeline-gpu.sh
      - scripts/check-recording-perf.sh
      - scripts/check-cuda-features.py
      - scripts/dev.sh
      - .github/workflows/backend.yml
  push:
    branches: [main, codex/linux-container-rebuild]
    paths:
      - Cargo.*
      - .cargo/**
      - crates/**
      - configs/**
      - examples/**
      - xtask/**
      - deny.toml
      - rust-toolchain.toml
      - containers/**
      - compose*.yaml
      - .dockerignore
      - scripts/check-backend.sh
      - scripts/check-cpu.sh
      - scripts/check-gpu.sh
      - scripts/check-pipeline-gpu.sh
      - scripts/check-recording-perf.sh
      - scripts/check-cuda-features.py
      - scripts/dev.sh
      - .github/workflows/backend.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Load the cached development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/development.Dockerfile
          target: development
          platforms: linux/amd64
          tags: oscope-development:r02
          load: true
          cache-from: type=gha,scope=oscope-development
          cache-to: type=gha,scope=oscope-development,mode=min,ignore-error=true
      - name: Backend checks without frontend installation
        run: bash scripts/dev.sh backend
      - name: Explicit CPU-only compilation and tests
        run: bash scripts/dev.sh cpu-tests
