name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The examples' --smoke runs are off for now, to save CI minutes (the
# owner's decision, P21), until the owner turns them back on: set this to
# "true". Clippy and the tests still compile every example here, and the
# local replays (scripts/ci-local.sh, scripts/ci-clone.sh) still run them
# before each pull request.
env:
  RUN_EXAMPLES: "false"

# The supported platforms: Windows and Ubuntu, on x86_64 (ADR-0003). Each runs
# every check, and one failing doesn't cancel the other.
jobs:
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
          - name: Ubuntu 24.04 x86_64
            os: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      # Debug info as line tables only, so that the test and example binaries
      # fit the Ubuntu runner's disk: with full debug info they passed 11 GiB
      # in P28, and the linker died of a bus error. Backtraces keep their files
      # and lines. The local replays keep full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # uv, for Python extensions (ADR-0020), on Ubuntu only (the owner's
      # decision, P26): their tests run there. The local replays run them on
      # both platforms. ex-python-node's --smoke needs uv too.
      - name: Install uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - name: Tests, the layering test among them
        run: cargo test --workspace --locked
        env:
          OSCOPE_PYTHON: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: The Python SDK's tests
        if: runner.os == 'Linux'
        working-directory: python/oscope-ext
        run: uv run --locked pytest
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Licences, advisories, bans and sources
        run: cargo deny --locked check
      - name: The server's version
        run: cargo run -p oscope-server --locked -- --version
      # The web app (W0.1, ADR-0040): its checks, then its end-to-end tests,
      # each against a server of its own, the one this job has just built.
      # The steps run in bash, which stops at the first command that fails.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: "The web app: its packages"
        working-directory: web
        run: npm ci
      - name: "The web app: types, lint, unit tests and the build"
        working-directory: web
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run build
      - name: "The web app: licences and advisories"
        working-directory: web
        shell: bash
        run: |
          npm run licences
          npm run advisories
      - name: "The web app: Playwright's browsers"
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: "The web app: end to end"
        working-directory: web
        run: npm run test:e2e
      # Every example with a binary, headless (examples/README.md).
      - name: The examples' --smoke runs
        if: env.RUN_EXAMPLES == 'true'
        shell: bash
        run: |
          for manifest in examples/*/Cargo.toml; do
            [ -f "$(dirname "$manifest")/src/main.rs" ] || continue
            name=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -1)
            echo "::group::$name --smoke"
            cargo run -q -p "$name" --locked -- --smoke
            echo "::endgroup::"
          done
