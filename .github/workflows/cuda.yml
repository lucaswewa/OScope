name: CUDA build

# The `cuda` feature needs nvcc, which the main CI doesn't install (ADR-0011).
# This job installs CUDA 13.4's compiler on Ubuntu and builds and checks the
# feature: weekly, by hand, and on pull requests that touch the compute code.
# The runner has no GPU, so the tests that need one skip themselves, and the
# fallback test meets a missing driver.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/oscope-compute/**"
      - "crates/oscope-imaging/**"
      - "crates/oscope-sim/**"
      - "examples/ex-cuda-check/**"
      - "examples/ex-demosaic/**"
      - "examples/ex-sim-bench/**"
      - ".github/workflows/cuda.yml"

permissions:
  contents: read

jobs:
  cuda:
    name: CUDA feature (Ubuntu 24.04, no GPU)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install CUDA 13.4's compiler, from NVIDIA's repository
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cuda-nvcc-13-4 cuda-cudart-dev-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy, with the feature
        run: >-
          cargo clippy -p oscope-compute -p oscope-imaging -p oscope-sim
          -p ex-cuda-check -p ex-demosaic -p ex-sim-bench
          --locked --all-targets
          --features oscope-compute/cuda,oscope-imaging/cuda,oscope-sim/cuda
          --features ex-cuda-check/cuda,ex-demosaic/cuda,ex-sim-bench/cuda
          -- -D warnings
      - name: Tests, with the feature
        run: >-
          cargo test -p oscope-compute -p oscope-imaging -p oscope-sim --locked
          --features oscope-compute/cuda,oscope-imaging/cuda,oscope-sim/cuda
      - name: The examples, which fall back to the CPU
        run: |
          cargo run -p ex-cuda-check --features cuda --locked -- --smoke
          cargo run -p ex-demosaic --features cuda --locked -- --smoke
          cargo run -p ex-sim-bench --features cuda --locked -- --smoke
