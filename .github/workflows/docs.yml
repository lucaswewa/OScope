name: Documentation
on:
  pull_request:
    paths: ['**/*.md', 'scripts/check-docs.py', '.github/workflows/docs.yml']
  push:
    branches: [main, codex/linux-container-rebuild]
    paths: ['**/*.md', 'scripts/check-docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: git show --format= --check HEAD
      - run: python3 scripts/check-docs.py
