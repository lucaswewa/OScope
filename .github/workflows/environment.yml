name: Development environment
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax and Compose configuration
        run: |
          for script in scripts/*.sh containers/*.sh; do bash -n "$script"; done
          bash scripts/dev.sh config
      - uses: docker/setup-buildx-action@v3
      - name: Load the cached development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/development.Dockerfile
          target: development
          platforms: linux/amd64
          tags: oscope-development:r02
          load: true
          cache-from: type=gha,scope=oscope-development
          cache-to: type=gha,scope=oscope-development,mode=min,ignore-error=true
      - name: Check tools without a GPU reservation
        run: bash scripts/dev.sh tools
      # The required-device probe runs locally: bash scripts/dev.sh gpu.
      # A hosted runner without a GPU cannot supply that evidence.
