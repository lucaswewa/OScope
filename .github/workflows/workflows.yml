name: Microscope workflow checkpoints
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: workflows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Load the cached development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/development.Dockerfile
          target: development
          platforms: linux/amd64
          tags: oscope-development:r02
          load: true
          cache-from: type=gha,scope=oscope-development
          cache-to: type=gha,scope=oscope-development,mode=min,ignore-error=true
      - name: Simulated calibration, scans and scientific report checkpoint
        run: bash scripts/dev.sh workflows
      - name: Required Python workflow and report execution
        run: bash scripts/dev.sh workflow-extensions
      # Required GPU preview equivalence and workflow smokes run on the workstation:
      # bash scripts/dev.sh workflows-gpu
