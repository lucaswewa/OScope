[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]
# A Python extension, not a crate (P26).
exclude = ["examples/ext-python-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# teta-wot v0.2.0's minimum.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lucaswewa/OScope"
publish = false

[workspace.dependencies]
# Only oscope-api may depend on teta-wot (ADR-0005); the layering test checks.
teta-wot = { git = "https://github.com/lucaswewa/teta-wot", tag = "v0.2.0" }
# The versions teta-wot v0.2.0 locks, except tokio's fixed 1.53.3, with the
# features OScope needs.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.9.5"
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.3"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
# Also in teta-wot v0.2.0's lock.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
# New in P04.
fs4 = "1.1.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# New in P06.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rayon = "1.12.0"
# New in P08b: image files.
png = "0.18.1"
tiff = { version = "0.11.3", default-features = false }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
# New in P16: the Thing Descriptions' snapshots.
insta = { version = "1.49.0", default-features = false }
# New in P07: CUDA, loaded at run time (ADR-0011).
find-msvc-tools = "0.1.14"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cufft", "dynamic-loading", "cuda-13040"] }
# New in P19: shared memory and a private file (oscope-shm). Both are already in
# the lock, through tokio.
libc = "0.2.189"
windows-sys = "0.61.2"
# New in P20: the job history (ADR-0016). 0.42.0 is under two weeks old.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# New in P24: `.omext` packages (ADR-0018). zip 9.2.0 is under two weeks old;
# sha2 0.10 shares sha1's digest, already in the lock.
semver = { version = "1.0.28", features = ["serde"] }
sha2 = "0.10.9"
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# New in P25: loading Rust extensions (ADR-0019). Already in the lock, through
# cudarc; 0.9.1 is under two weeks old.
libloading = "0.9.0"
# New in P28: OME-Zarr v3 stores (D15, ADR-0021), with only the codecs OScope
# writes; and, for tests only, NGFF's JSON Schemas checked without fetching.
jsonschema = { version = "0.33.0", default-features = false }
zarrs = { version = "0.22.10", default-features = false, features = ["filesystem", "zstd"] }
ex-common = { path = "examples/common" }
oscope-acquire = { path = "crates/oscope-acquire" }
oscope-api = { path = "crates/oscope-api" }
oscope-compute = { path = "crates/oscope-compute" }
oscope-ext = { path = "crates/oscope-ext" }
oscope-ext-sdk = { path = "crates/oscope-ext-sdk" }
oscope-hal = { path = "crates/oscope-hal" }
oscope-imaging = { path = "crates/oscope-imaging" }
oscope-jobs = { path = "crates/oscope-jobs" }
oscope-pipeline = { path = "crates/oscope-pipeline" }
oscope-sim = { path = "crates/oscope-sim" }
oscope-server = { path = "crates/oscope-server" }
oscope-shm = { path = "crates/oscope-shm" }
oscope-store = { path = "crates/oscope-store" }
oscope-core = { path = "crates/oscope-core" }

# Every crate takes these with `[lints] workspace = true`, except the crates
# allowed unsafe code (plan §4.3). They repeat them, with unsafe code allowed.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
