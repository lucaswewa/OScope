[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# teta-wot v0.2.0's minimum.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lucaswewa/OScope"
publish = false

[workspace.dependencies]
# Only oscope-api may depend on teta-wot (ADR-0005); the layering test checks.
teta-wot = { git = "https://github.com/lucaswewa/teta-wot", tag = "v0.2.0" }
# The versions teta-wot v0.2.0 locks, except tokio's fixed 1.53.3, with the
# features OScope needs.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.9.5"
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.3"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
# Also in teta-wot v0.2.0's lock.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
# New in P04.
fs4 = "1.1.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# New in P06.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rayon = "1.12.0"
# New in P08b: image files.
png = "0.18.1"
tiff = { version = "0.11.3", default-features = false }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
# New in P16: the Thing Descriptions' snapshots.
insta = { version = "1.49.0", default-features = false }
# 0.6.0 is MIT OR Apache-2.0; later versions add the IJG licence (P14's notes).
jpeg-encoder = "=0.6.0"
# New in P07: CUDA, loaded at run time (ADR-0011).
find-msvc-tools = "0.1.14"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cufft", "dynamic-loading", "cuda-13040"] }
ex-common = { path = "examples/common" }
oscope-acquire = { path = "crates/oscope-acquire" }
oscope-api = { path = "crates/oscope-api" }
oscope-compute = { path = "crates/oscope-compute" }
oscope-hal = { path = "crates/oscope-hal" }
oscope-imaging = { path = "crates/oscope-imaging" }
oscope-sim = { path = "crates/oscope-sim" }
oscope-core = { path = "crates/oscope-core" }

# Every crate takes these with `[lints] workspace = true`, except the crates
# allowed unsafe code (plan §4.3). They repeat them, with unsafe code allowed.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
