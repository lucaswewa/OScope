[workspace]
resolver = "3"
members = [
    "crates/oscope-core", "crates/oscope-compute", "crates/oscope-imaging",
    "crates/oscope-stitch", "crates/oscope-volume", "examples/ex-core-tour",
    "examples/ex-compute-info", "examples/ex-cuda-check",
    "crates/oscope-hal", "crates/oscope-sim", "crates/oscope-acquire",
    "examples/ex-hal-fakes", "examples/ex-sim-camera", "examples/ex-frame-bus",
    "examples/ex-acquisition", "crates/oscope-store", "crates/oscope-jobs",
    "crates/oscope-pipeline", "crates/oscope-shm", "crates/oscope-ext-sdk",
    "crates/oscope-ext", "crates/oscope-report", "examples/ex-record",
    "examples/ex-pipeline", "examples/ex-python-node", "examples/ex-rust-ext",
    "examples/ext-rust-node", "crates/oscope-api", "crates/oscope-server", "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lucaswewa/OScope"
publish = false

[workspace.dependencies]
# Retain the pinned source's versions and features. Add dependencies only as
# their implementation is ported; Cargo.lock is pruned from the source lock.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.9.5"
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.3"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }
anyhow = "1.0.104"
argon2 = "=0.6.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
nvml-wrapper = "=0.13.0"
rcgen = "=0.14.10"
rpassword = "=7.5.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29.0"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
toml_edit = { version = "0.22.27", default-features = false, features = ["parse", "display"] }
teta-wot = { git = "https://github.com/lucaswewa/teta-wot", tag = "v0.2.0" }
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
fs4 = "1.1.0"
insta = { version = "1.49.0", default-features = false }
jsonschema = { version = "0.33.0", default-features = false }
libc = "0.2.189"
libloading = "0.9.0"
minijinja = { version = "=3.0.5", features = ["serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
semver = { version = "1.0.28", features = ["serde"] }
sha2 = "0.10.9"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
zarrs = { version = "0.22.10", default-features = false, features = ["filesystem", "zstd"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cufft", "dynamic-loading", "cuda-13040"] }
png = "0.18.1"
rayon = "1.12.0"
rustfft = "6.4.1"
tempfile = "3.27.0"
tiff = { version = "0.11.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
oscope-core = { path = "crates/oscope-core" }
# Feature-bearing members enable CUDA themselves. Disabling implicit dependency
# defaults keeps the explicit workspace CPU-only build free of CUDA.
oscope-compute = { path = "crates/oscope-compute", default-features = false }
oscope-imaging = { path = "crates/oscope-imaging", default-features = false }
oscope-stitch = { path = "crates/oscope-stitch" }
oscope-volume = { path = "crates/oscope-volume", default-features = false }
oscope-hal = { path = "crates/oscope-hal" }
oscope-sim = { path = "crates/oscope-sim", default-features = false }
oscope-acquire = { path = "crates/oscope-acquire", default-features = false }
oscope-store = { path = "crates/oscope-store", default-features = false }
oscope-jobs = { path = "crates/oscope-jobs" }
oscope-pipeline = { path = "crates/oscope-pipeline", default-features = false }
oscope-shm = { path = "crates/oscope-shm" }
oscope-ext-sdk = { path = "crates/oscope-ext-sdk" }
oscope-ext = { path = "crates/oscope-ext", default-features = false }
oscope-report = { path = "crates/oscope-report" }
oscope-api = { path = "crates/oscope-api", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# Preserve the source workspace's test-build settings for the ported algorithms.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.oscope-compute]
opt-level = 2

[profile.dev.package.oscope-imaging]
opt-level = 2

[profile.dev.package.oscope-volume]
opt-level = 2

[profile.dev.package.oscope-sim]
opt-level = 2

# Preserve the source's checksum throughput for the scratch recording log.
[profile.dev.package.crc32fast]
opt-level = 3
