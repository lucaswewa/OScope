[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# teta-wot v0.2.0's minimum.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lucaswewa/OScope"
publish = false

[workspace.dependencies]
# Only oscope-api may depend on teta-wot (ADR-0005); the layering test checks.
teta-wot = { git = "https://github.com/lucaswewa/teta-wot", tag = "v0.2.0" }
serde_json = "1"

# Every crate takes these with `[lints] workspace = true`, except the crates
# allowed unsafe code (plan §4.3). They repeat them, with unsafe code allowed.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
