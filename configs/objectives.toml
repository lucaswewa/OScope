# OScope's objective catalogue (plan §5.9, ADR-0012).
#
# These are Mitutoyo's published values for the M Plan Apo objectives,
# to be confirmed on the instrument in M3. The catalogue built into
# oscope-hal (`ObjectiveCatalogue::mitutoyo`) is the same, and a test keeps
# them so. Lengths are in micrometres (ADR-0007): 200000 is 200 mm.
#
# Each objective's `design_tube_lens` is the tube lens its magnification is
# stated for. It is 200 mm, Mitutoyo's, unless given.

# The instrument's tube lens.
tube_lens = 200000

