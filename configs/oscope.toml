# oscope-server's configuration, with every key at its default except the
# folders, which go in the repository's own .oscope/ folder:
#
#     cargo run -p oscope-server -- --config configs/oscope.toml
#
# Relative folders are relative to this file's folder.

# The file's version (P52): a file without one is version 1's, and still read.
version = 2

[network]
# 127.0.0.1: only this computer can connect.
address = "127.0.0.1"
port = 8210

[storage]
data_root = "../.oscope/data"
scratch_root = "../.oscope/scratch"

[logging]
# What to record, in tracing's EnvFilter syntax, such as "info,oscope_api=debug".
level = "info"
# How many of the newest records to keep in memory, for queries and the tail.
ring = 50000
# How many days of daily files to keep, in data_root/logs.
keep_days = 30

# The devices. Kept, but not read until the device Things (P16).
[devices]

# The web app's built files, served at / beside the API (W0.1). Without it,
# the server serves no app: `npm --prefix web run build` makes them.
# [web]
# root = "../web/dist"
