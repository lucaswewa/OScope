[package]
name = "oscope-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["cuda"]
# Previews on the GPU (ADR-0011).
cuda = ["oscope-acquire/cuda", "oscope-compute/cuda", "oscope-ext/cuda", "oscope-imaging/cuda", "oscope-pipeline/cuda", "oscope-sim/cuda", "oscope-store/cuda", "oscope-workflows/cuda"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
chrono.workspace = true
fs4.workspace = true
futures-util.workspace = true
nvml-wrapper.workspace = true
oscope-acquire.workspace = true
oscope-compute.workspace = true
oscope-core.workspace = true
oscope-ext.workspace = true
oscope-hal.workspace = true
oscope-imaging.workspace = true
oscope-jobs.workspace = true
oscope-pipeline.workspace = true
oscope-store.workspace = true
oscope-stitch.workspace = true
oscope-shm.workspace = true
oscope-sim.workspace = true
oscope-report.workspace = true
oscope-workflows.workspace = true
rand.workspace = true
rayon.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
# Serving over TLS (P49).
teta-wot = { workspace = true, features = ["tls"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
rcgen.workspace = true
teta-wot = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect"] }
zune-core.workspace = true
zune-jpeg.workspace = true

[lints]
workspace = true
