[package]
name = "oscope-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Previews on the GPU (ADR-0011).
cuda = ["oscope-acquire/cuda"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
fs4.workspace = true
futures-util.workspace = true
oscope-acquire.workspace = true
oscope-compute.workspace = true
oscope-core.workspace = true
oscope-ext.workspace = true
oscope-hal.workspace = true
oscope-imaging.workspace = true
oscope-jobs.workspace = true
oscope-pipeline.workspace = true
oscope-store.workspace = true
oscope-shm.workspace = true
oscope-sim.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
teta-wot.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
# Service mode (P19).
teta-wot = { workspace = true, features = ["windows-service"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
teta-wot = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
zune-core.workspace = true
zune-jpeg.workspace = true

[lints]
workspace = true
