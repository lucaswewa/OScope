[package]
name = "oscope-compute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace's lints, with unsafe code allowed (plan §4.3). Clippy checks
# that every unsafe block has a `SAFETY:` comment.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[features]
default = ["cuda"]
# The CUDA backend: needs the CUDA toolkit's nvcc to build (ADR-0011).
cuda = ["dep:cudarc"]

[dependencies]
cudarc = { workspace = true, optional = true }
oscope-core.workspace = true
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
rand.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[[bench]]
name = "kernels"
harness = false
