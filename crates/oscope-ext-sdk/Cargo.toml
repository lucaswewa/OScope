[package]
name = "oscope-ext-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace's lints, with unsafe code allowed (plan §4.3). Clippy checks
# that every unsafe block has a `SAFETY:` comment.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
