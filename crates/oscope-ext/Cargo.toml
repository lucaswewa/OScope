[package]
name = "oscope-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["cuda"]
cuda = ["oscope-compute/cuda", "oscope-pipeline/cuda", "oscope-store/cuda"]

[dependencies]
chrono.workspace = true
libloading.workspace = true
oscope-compute.workspace = true
oscope-ext-sdk.workspace = true
oscope-hal.workspace = true
oscope-core.workspace = true
oscope-pipeline.workspace = true
oscope-shm.workspace = true
oscope-store.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
oscope-report.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# The workspace's lints, with unsafe code allowed (plan §4.3). Clippy checks
# that every unsafe block has a `SAFETY:` comment.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
