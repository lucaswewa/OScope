[package]
name = "oscope-imaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["cuda"]
# The colour steps on the GPU: their CUDA twins are in oscope-compute.
cuda = ["oscope-compute/cuda"]

[dependencies]
oscope-compute.workspace = true
oscope-core.workspace = true
png.workspace = true
rayon.workspace = true
rustfft.workspace = true
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true
tiff = { workspace = true, features = ["deflate", "jpeg", "lzw"] }
zune-core.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
criterion.workspace = true
rand.workspace = true
tempfile.workspace = true


[[bench]]
name = "demosaic"
harness = false

[lints]
workspace = true
