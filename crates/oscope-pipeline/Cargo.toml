[package]
name = "oscope-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["cuda"]
# Nodes' CUDA steps, with images kept on the GPU between them: needs the CUDA
# toolkit to build (ADR-0011).
cuda = ["oscope-compute/cuda", "oscope-imaging/cuda", "oscope-volume/cuda"]

[dependencies]
oscope-compute.workspace = true
oscope-core.workspace = true
oscope-imaging.workspace = true
oscope-jobs.workspace = true
oscope-volume.workspace = true
rayon.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
