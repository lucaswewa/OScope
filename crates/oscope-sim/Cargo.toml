[package]
name = "oscope-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The camera's exposure on the GPU (P15), through oscope-compute's CUDA backend.
cuda = ["oscope-compute/cuda"]

[dependencies]
chrono.workspace = true
oscope-compute.workspace = true
oscope-core.workspace = true
oscope-hal.workspace = true
oscope-imaging.workspace = true
rayon.workspace = true
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
tiff.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
