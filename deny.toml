# cargo-deny: the dependency policy of ADR-0002. CI runs `cargo deny check`.

[graph]
# The supported platforms (ADR-0003).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# RustSec advisories and unmaintained crates fail the check, and so do yanked
# versions. An advisory that doesn't apply goes in `ignore`, with the reason.
yanked = "deny"
ignore = []

[licenses]
# The licences that allow distributing OScope under MIT (ADR-0002). Adding one
# needs the owner's decision.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# The list is the policy, so a licence no crate uses yet stays in it.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate are reported, not refused: teta-wot's tree has some.
multiple-versions = "warn"
wildcards = "deny"
# OScope's own crates depend on each other by path; none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/lucaswewa/teta-wot"]
