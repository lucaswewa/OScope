# cargo-deny: the dependency policy of ADR-0002. CI runs `cargo deny check`.

[graph]
# The supported platforms (ADR-0003).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# RustSec advisories and unmaintained crates fail the check, and so do yanked
# versions. An advisory that doesn't apply goes in `ignore`, with the reason.
yanked = "deny"
# Typst's dependency tree (P47, ADR-0030), at the owner's choice: each has
# no safe upgrade that Typst 0.15.1 accepts.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode, unmaintained: through syntect, Typst's syntax highlighting" },
    { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained: a build-time macro crate, through hayagriva" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, unmaintained: Typst's text shaping" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, unmaintained: Typst's font reading" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml, unmaintained: through serde_yaml, Typst's yaml()" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust, unmaintained: through syntect" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38: only through citationberg, Typst's CSL bibliography styles, which OScope's reports don't use; citationberg pins 0.38" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38: as RUSTSEC-2026-0194" },
]

[licenses]
# The licences that allow distributing OScope under MIT (ADR-0002). Adding one
# needs the owner's decision.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# The list is the policy, so a licence no crate uses yet stays in it.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate are reported, not refused: teta-wot's tree has some.
multiple-versions = "warn"
wildcards = "deny"
# OScope's own crates depend on each other by path; none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/lucaswewa/teta-wot"]

# A build-time crate of Typst's tree (through psm and stacker): Apache-2.0
# with LLVM's exception, which only grants more (P47, ADR-0030).
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
crate = "ar_archive_writer"
