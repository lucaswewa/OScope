<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotations</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; display: grid; grid-template-rows: auto auto minmax(300px, 1fr) auto; height: 100vh; box-sizing: border-box; gap: 8px; }
    h1 { font-size: 1.2em; margin: 0; }
    #controls { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
    #controls label { display: flex; gap: 6px; align-items: center; }
    #stage { position: relative; min-height: 300px; }
    #viewer { position: absolute; inset: 0; background: #000; border: 1px solid #8884; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #overlay .area { fill: #ffd60a33; fill-rule: evenodd; stroke: #ffd60a; stroke-width: 2; }
    #overlay .line, #overlay .drawing { fill: none; stroke: #4cc9f0; stroke-width: 2; }
    #overlay .drawing { stroke-dasharray: 6 4; }
    #overlay .point { fill: #f72585; }
    #overlay text { fill: #fff; font-size: 12px; paint-order: stroke; stroke: #000; stroke-width: 3; }
    #measurements { max-height: 30vh; overflow: auto; }
    table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 2px 10px; text-align: left; border-bottom: 1px solid #8884; }
    .bad { color: #d33; }
  </style>
</head>
<body>
  <h1>Annotations <span id="message">: looking for the newest stitched mosaic…</span></h1>
  <div id="controls">
    <label><input id="draw" type="checkbox" checked> Draw</label>
    <label>Shape <select id="shape"><option>Polygon</option><option value="LineString">Line</option><option>Point</option></select></label>
    <label>Layer <input id="layer" value="regions" size="10"></label>
    <label>Name <input id="name" size="12"></label>
    <span>Click to add points; double-click or Enter to finish; Esc to drop it.</span>
    <a id="csv" download="measurements.csv">Download CSV</a>
  </div>
  <div id="stage"><div id="viewer"></div><svg id="overlay"></svg></div>
  <div id="measurements">
    <table>
      <thead><tr><th>Layer</th><th>ID</th><th>Name</th><th>Shape</th><th>Length (<span id="unit">µm</span>)</th><th>Area (<span id="area-unit">µm²</span>)</th><th>Pixels</th><th>Means ± SD</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script src="/vendor/openseadragon-6.1.1/openseadragon.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
