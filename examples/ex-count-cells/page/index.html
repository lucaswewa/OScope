<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell count</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; display: grid; grid-template-rows: auto auto 1fr; height: 100vh; box-sizing: border-box; gap: 8px; }
    h1 { font-size: 1.2em; margin: 0; }
    #controls { display: flex; gap: 20px; align-items: center; }
    #stage { position: relative; min-height: 300px; }
    #viewer { position: absolute; inset: 0; background: #000; border: 1px solid #8884; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #overlay path { fill: none; stroke-width: 1.5; stroke: #ffd60a; }
    #overlay .weak { stroke: #f4a261; }
    #overlay .moderate { stroke: #e76f51; }
    #overlay .strong { stroke: #d62828; }
  </style>
</head>
<body>
  <h1>Cell count <span id="message">: looking for a counted mosaic…</span></h1>
  <div id="controls">
    <label><input id="show" type="checkbox" checked> Outlines</label>
    <a id="csv" download="cells.csv">Download the table</a>
  </div>
  <div id="stage"><div id="viewer"></div><svg id="overlay"></svg></div>
  <script src="/vendor/openseadragon-6.1.1/openseadragon.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
