<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep zoom</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; box-sizing: border-box; gap: 8px; }
    h1 { font-size: 1.2em; margin: 0; }
    #controls { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
    #controls label { display: flex; gap: 6px; align-items: center; }
    #controls output { min-width: 3.5em; font-variant-numeric: tabular-nums; }
    #viewer { min-height: 300px; background: #000; border: 1px solid #8884; }
    #times { font-variant-numeric: tabular-nums; color: #888; }
    .bad { color: #d33; }
  </style>
</head>
<body>
  <h1>Deep zoom <span id="message">: looking for the newest stitched mosaic…</span></h1>
  <div id="controls">
    <label>Black <input id="black" type="range" min="0" max="1" step="0.005"><output id="black-value"></output></label>
    <label>White <input id="white" type="range" min="0" max="1" step="0.005"><output id="white-value"></output></label>
    <label>Gamma <input id="gamma" type="range" min="0.3" max="3" step="0.05"><output id="gamma-value"></output></label>
    <button id="reset" type="button">As made</button>
  </div>
  <div id="viewer"></div>
  <div id="times">Tiles: none yet.</div>
  <script src="/vendor/openseadragon-6.1.1/openseadragon.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
