<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depth from focus</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; box-sizing: border-box; gap: 8px; }
    h1 { font-size: 1.2em; margin: 0; }
    #controls { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
    #controls label { display: flex; gap: 6px; align-items: center; }
    #controls output { min-width: 2.5em; font-variant-numeric: tabular-nums; }
    #view { position: relative; min-height: 300px; background: #000; border: 1px solid #8884; }
    #about { font-variant-numeric: tabular-nums; color: #888; }
    .bad { color: #d33; }
  </style>
</head>
<body>
  <h1>Depth from focus <span id="message">: looking for the newest heights…</span></h1>
  <div id="controls">
    <label>Depth × <input id="depth" type="range" min="1" max="40" step="1" value="10"><output id="depth-value">10</output></label>
    <label><input id="sure" type="checkbox"> Only where sure</label>
  </div>
  <div id="view"></div>
  <div id="about">Drag to turn it, scroll to zoom.</div>
  <script src="/vendor/vtk.js-38.0.4/vtk.js"></script>
  <script src="app.js"></script>
</body>
</html>
