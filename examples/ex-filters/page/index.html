<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filters</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d2125;
    --muted: #5d6874;
    --page: #ffffff;
    --line: #d9dee3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e4e7ea; --muted: #9ba6b1; --page: #16191c; --line: #2e353b; }
  }
  body { margin: 0 auto; max-width: 1200px; padding: 16px; font: 15px/1.5 system-ui, sans-serif; color: var(--text); background: var(--page); }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 12px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  figcaption { padding: 8px 10px; }
  .times { font: 0.9rem/1.4 ui-monospace, monospace; font-variant-numeric: tabular-nums; color: var(--muted); }
</style>
</head>
<body>
<h1>Filters</h1>
<p class="muted" id="summary">loading…</p>
<div class="grid" id="cards"></div>
<script src="app.js"></script>
</body>
</html>
