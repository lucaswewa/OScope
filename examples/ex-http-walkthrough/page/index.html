<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microscope control</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d2125;
    --muted: #5d6874;
    --page: #ffffff;
    --line: #d9dee3;
    --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e4e7ea; --muted: #9ba6b1; --page: #16191c; --line: #2e353b; --bad: #f97066; }
  }
  body { margin: 0 auto; max-width: 760px; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; color: var(--text); background: var(--page); }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 24px 0 8px; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .readout { font: 1.3rem/1.4 ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  button, select, input { font: inherit; padding: 4px 10px; }
  input[type=number] { width: 8em; }
</style>
</head>
<body>
<h1>Microscope control</h1>
<p class="muted">The simulated microscope's Things, over its HTTP API: the README shows the same with <code>curl</code>.</p>

<h2>Stage</h2>
<div class="readout" id="position">…</div>
<div class="muted" id="status"></div>
<div class="row">
  <button id="home">Home</button>
  <button id="halt">Halt</button>
</div>
<div class="row" id="jogs"></div>
<div class="row">
  x <input type="number" id="x" value="45000"> y <input type="number" id="y" value="12500"> z <input type="number" id="z" value="5000"> µm
  <button id="move">Move to</button>
</div>

<h2>Objective and light</h2>
<div class="row">
  <select id="objective"></select> <button id="fit">Fit</button>
  <span class="muted" id="fitted"></span>
</div>
<div class="row">
  <label><input type="checkbox" id="light" checked> transmitted light</label>
  <input type="range" id="intensity" min="0" max="1" step="0.05" value="1">
</div>

<h2>Sample</h2>
<div class="row">
  <select id="sample"></select> <button id="load">Load</button> <button id="unload">Unload</button>
  <span class="muted" id="loaded"></span>
</div>

<p id="message" class="muted"></p>
<script src="app.js"></script>
</body>
</html>
