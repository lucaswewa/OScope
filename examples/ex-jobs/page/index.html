<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d2125;
    --muted: #5d6874;
    --page: #ffffff;
    --line: #d9dee3;
    --bar: #3e63dd;
    --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e4e7ea; --muted: #9ba6b1; --page: #16191c; --line: #2e353b; --bar: #849dff; --bad: #f97066; }
  }
  body { margin: 0 auto; max-width: 980px; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: var(--text); background: var(--page); }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 20px 0 6px; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  button, input { font: inherit; padding: 3px 8px; }
  input[type=number] { width: 5.5em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 120px; }
  .bar > div { height: 100%; background: var(--bar); }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>Jobs</h1>
<p class="muted">The job service: stage tours run as hardware jobs, one at a time, holding the hardware lock; crunching runs as compute jobs, two at a time, sharing 2048 MiB of GPU.</p>
<div class="row" id="hardware">…</div>
<div class="row">
  <button id="tour">Tour</button>
  <label>stops <input type="number" id="points" value="5" min="1" max="50"></label>
  <label>µm apart <input type="number" id="step" value="1000"></label>
</div>
<div class="row">
  <button id="crunch">Crunch</button>
  <label>seconds <input type="number" id="seconds" value="5" min="0.1"></label>
  <label>GPU MiB <input type="number" id="gpu" value="0" min="0" max="2048"></label>
</div>
<div class="row">
  <button id="jog">Jog the stage by hand</button>
  <span class="muted">refused while a tour holds the hardware</span>
</div>
<p id="message" class="muted"></p>
<h2>Queue</h2>
<div class="wrap"><table><thead><tr><th>Job</th><th>State</th><th>Progress</th><th></th></tr></thead><tbody id="queue"></tbody></table></div>
<h2>History</h2>
<div class="wrap"><table><thead><tr><th>Job</th><th>State</th><th>Ended</th><th>Results</th></tr></thead><tbody id="history"></tbody></table></div>
<script src="app.js"></script>
</body>
</html>
