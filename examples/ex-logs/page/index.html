<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OScope logs</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d2125;
    --muted: #5d6874;
    --page: #ffffff;
    --panel: #f4f6f8;
    --line: #d9dee3;
    --warn: #9a6700;
    --error: #b42318;
    --critical-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e4e7ea;
      --muted: #9ba6b1;
      --page: #16191c;
      --panel: #1e2226;
      --line: #2e353b;
      --warn: #e3b341;
      --error: #f97066;
      --critical-text: #16191c;
    }
  }
  body {
    margin: 0 auto;
    max-width: 1100px;
    padding: 24px 16px;
    font: 15px/1.5 system-ui, sans-serif;
    color: var(--text);
    background: var(--page);
  }
  h1 { font-size: 1.4rem; margin: 0; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  form, .writer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  input, select, button { font: inherit; padding: 4px 8px; }
  input[type="text"] { min-width: 0; flex: 1 1 140px; }
  .muted { color: var(--muted); }
  .error { color: var(--error); }
  .scroll { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font: 13px/1.45 ui-monospace, Consolas, monospace; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; }
  th, td { padding: 3px 8px; vertical-align: top; border-bottom: 1px solid var(--line); }
  td:nth-child(4) { overflow-wrap: anywhere; }
  .fields, .level.trace, .level.debug { color: var(--muted); }
  .level.warn { color: var(--warn); }
  .level.error { color: var(--error); }
  .level.critical { color: var(--critical-text); background: var(--error); }
  .note { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<h1>OScope logs</h1>
<p class="muted">The live tail of the server's log, the records that match the filter, newest at the bottom.</p>
<form id="filters">
  <label>Level
    <select name="level">
      <option>trace</option><option>debug</option><option selected>info</option>
      <option>warn</option><option>error</option><option>critical</option>
    </select>
  </label>
  <input type="text" name="target" placeholder="Target starts with…" aria-label="Target">
  <input type="text" name="text" placeholder="Text contains…" aria-label="Text">
  <button type="submit">Apply</button>
  <label><input type="checkbox" id="pause"> Pause</label>
</form>
<p id="status" class="muted">Connecting…</p>
<div class="scroll" id="scroll">
  <table>
    <thead><tr><th>Time</th><th>Level</th><th>Target</th><th>Message</th></tr></thead>
    <tbody id="tail"></tbody>
  </table>
</div>
<h2>Write a record</h2>
<div class="writer" id="writer">
  <input type="text" id="note" placeholder="A note, such as “the slide is loaded”" aria-label="Note">
</div>
<h2>Daily files</h2>
<ul id="files"></ul>
<script src="app.js"></script>
</body>
</html>
