# A dummy extension for ex-omext, which opens its extensions without Python:
# it lists `hello.greet`, and runs nothing. A server that runs Python (P26)
# makes its environment when it installs it, and runs it.
id = "org.oscope.examples.hello"
name = "Hello"
version = "0.1.0"
license = "MIT"
publisher = "OScope examples"
description = "A dummy extension: a greeting node and its panel, listed but not run."
oscope-api = "^1.0"
kind = "python"
assets = ["panels/greet.json"]

[provides]
nodes = ["hello.greet"]
panels = ["hello.greeting"]

[python]
requires-python = ">=3.12"
dependencies = []
entry = "hello"
