# A dummy extension for ex-omext. OScope installs and lists it, but runs no
# Python extension before P26: `hello.greet` is a name, not yet a node.
id = "org.oscope.examples.hello"
name = "Hello"
version = "0.1.0"
license = "MIT"
publisher = "OScope examples"
description = "A dummy extension: a greeting node and its panel, listed but not run."
oscope-api = "^1.0"
kind = "python"
assets = ["panels/greet.json"]

[provides]
nodes = ["hello.greet"]
panels = ["hello.greeting"]

[python]
requires-python = ">=3.12"
dependencies = []
entry = "hello"
