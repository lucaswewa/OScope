<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; max-width: 640px; }
    h1 { font-size: 1.2em; margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
    output { display: block; font-family: ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Power <span id="dry"></span></h1>
  <div class="row">
    <label><input type="checkbox" id="force"> Force past a job</label>
    <button data-action="restart">Restart the service</button>
    <button data-action="reboot">Reboot</button>
    <button data-action="shutdown">Shut down</button>
  </div>
  <output id="said"></output>
  <script src="app.js"></script>
</body>
</html>
