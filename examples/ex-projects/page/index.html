<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OScope projects</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 1.3rem; margin: 0 12px 0 0; }
  input, button { font: inherit; padding: 4px 8px; }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { border: 1px solid #8884; border-radius: 8px; overflow: hidden; cursor: pointer; background: #8881; }
  .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #8883; }
  .card div { padding: 8px 12px; }
  h2 { font-size: 1rem; margin: 0 0 4px; }
  .muted { opacity: 0.7; font-size: 0.85rem; }
  .tag { display: inline-block; margin: 4px 4px 0 0; padding: 0 8px; border-radius: 10px; background: #4a7aff33; font-size: 0.8rem; cursor: pointer; }
  #details { margin-top: 24px; }
  #details li { margin: 4px 0; }
  code { font-size: 0.8rem; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>Projects</h1>
  <input id="search" type="search" placeholder="Search names, samples and tags">
  <span id="filter" class="tag" hidden></span>
  <button id="previous">Previous</button>
  <span id="paging" class="muted"></span>
  <button id="next">Next</button>
  <button id="create">New project</button>
</header>
<main id="cards"></main>
<section id="details"></section>
<p id="status" class="muted"></p>
<script src="app.js"></script>
</body>
</html>
