[package]
name = "ex-record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["cuda"]
# The simulated camera's rendering on the GPU: on the CPU it renders about
# 10 frames a second at full resolution, below the design rate.
cuda = ["oscope-sim/cuda", "oscope-acquire/cuda"]

[dependencies]
anyhow.workspace = true
oscope-acquire.workspace = true
oscope-core.workspace = true
oscope-hal.workspace = true
oscope-jobs.workspace = true
oscope-sim.workspace = true
oscope-store.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
