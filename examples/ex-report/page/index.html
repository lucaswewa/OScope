<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; display: grid; grid-template-rows: auto auto 1fr; height: 100vh; box-sizing: border-box; gap: 8px; }
    h1 { font-size: 1.2em; margin: 0; }
    ul { margin: 0; }
    iframe { width: 100%; height: 100%; border: 1px solid #8884; background: #fff; }
  </style>
</head>
<body>
  <h1>Reports <span id="message">: looking for reports…</span></h1>
  <ul id="reports"></ul>
  <iframe id="view" title="The newest HTML report"></iframe>
  <script src="app.js"></script>
</body>
</html>
