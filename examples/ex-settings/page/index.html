<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; max-width: 720px; }
    h1 { font-size: 1.2em; margin: 0 0 8px; }
    h2 { font-size: 1em; margin: 16px 0 4px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
    pre, textarea { font: 13px ui-monospace, monospace; }
    textarea { width: 100%; box-sizing: border-box; height: 16em; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <h2>Your display</h2>
  <div class="row">
    <select id="theme"><option>system</option><option>light</option><option>dark</option></select>
    <select id="units"><option>um</option><option>mm</option></select>
    <select id="colormap"><option>grey</option><option>viridis</option><option>magma</option><option>inferno</option></select>
    <label><input type="checkbox" id="scale_bar"> Scale bar</label>
  </div>
  <h2>The configuration file's</h2>
  <pre id="file"></pre>
  <h2>All of them, as a document</h2>
  <textarea id="document" spellcheck="false"></textarea>
  <div class="row"><button id="import">Import</button> <output id="said"></output></div>
  <script src="app.js"></script>
</body>
</html>
