<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulated 3D samples</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d2125;
    --muted: #5d6874;
    --page: #ffffff;
    --line: #d9dee3;
    --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e4e7ea;
      --muted: #9ba6b1;
      --page: #16191c;
      --line: #2e353b;
      --bad: #f97066;
    }
  }
  body {
    margin: 0 auto;
    max-width: 1400px;
    padding: 24px 16px;
    font: 15px/1.5 system-ui, sans-serif;
    color: var(--text);
    background: var(--page);
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 28px 0 8px; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  figure { margin: 0; }
  figure img { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: #000; }
  figcaption { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  label { display: flex; align-items: center; gap: 12px; margin: 8px 0; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; max-width: 480px; }
</style>
</head>
<body>
<h1>Simulated 3D samples</h1>
<p id="summary" class="muted">Loading…</p>

<h2>A reflective surface, stepped through in z</h2>
<p id="surface-note" class="muted"></p>
<label>z <input id="surface-z" type="range" min="0" value="0"> <span id="surface-z-text"></span></label>
<div class="row">
  <figure><img id="surface-plane" alt="the surface at this z"><figcaption>In reflected light at this z: the parts at this height are sharp.</figcaption></figure>
  <figure><img id="surface-truth" alt="the true height map"><figcaption id="surface-truth-caption">The true height map, from blue (low) to yellow (high).</figcaption></figure>
  <figure><img id="surface-found" alt="depth from focus"><figcaption id="surface-found-caption">What depth from focus finds, on the same scale.</figcaption></figure>
</div>

<h2>Fluorescent cells, stepped through in z</h2>
<p id="cells-note" class="muted"></p>
<label>z <input id="cells-z" type="range" min="0" value="0"> <span id="cells-z-text"></span></label>
<div class="row">
  <figure><img id="cells-wide" alt="widefield"><figcaption id="cells-wide-caption">Widefield</figcaption></figure>
  <figure><img id="cells-confocal" alt="confocal"><figcaption id="cells-confocal-caption">Confocal</figcaption></figure>
  <figure><img id="cells-truth" alt="the true volume at this z"><figcaption>The true volume at this z: nuclei blue, membranes green, organelles orange.</figcaption></figure>
</div>
<script src="app.js"></script>
</body>
</html>
