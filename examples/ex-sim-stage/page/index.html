<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulated stage</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d2125;
    --muted: #5d6874;
    --page: #ffffff;
    --line: #d9dee3;
    --band: rgba(93, 104, 116, 0.10);
    --x: #2a6fdb;
    --y: #1a7f37;
    --z: #b54708;
    --pulse: #d92d20;
    --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e4e7ea;
      --muted: #9ba6b1;
      --page: #16191c;
      --line: #2e353b;
      --band: rgba(155, 166, 177, 0.12);
      --x: #6ea8fe;
      --y: #4ac26b;
      --z: #f5a65b;
      --pulse: #f97066;
      --bad: #f97066;
    }
  }
  body {
    margin: 0 auto;
    max-width: 1200px;
    padding: 24px 16px;
    font: 15px/1.5 system-ui, sans-serif;
    color: var(--text);
    background: var(--page);
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 28px 0 8px; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  canvas { width: 100%; height: 360px; display: block; border: 1px solid var(--line); }
  .key span { margin-right: 16px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  td { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Simulated stage</h1>
<p id="summary" class="muted">Loading…</p>
<h2>Its reported position against time</h2>
<p class="key"><span style="color: var(--x)">x</span><span style="color: var(--y)">y</span><span style="color: var(--z)">z</span><span style="color: var(--pulse)">trigger pulses</span></p>
<canvas id="plot"></canvas>
<p class="muted">Shaded bands are the motions in the table below, and the jog at the end. Each line is in millimetres, against simulated seconds.</p>
<h2>Each motion, planned and measured</h2>
<table>
  <thead><tr><th>Motion</th><th>Started</th><th>Planned</th><th>Measured</th><th>Late</th></tr></thead>
  <tbody id="motions"></tbody>
</table>
<script src="app.js"></script>
</body>
</html>
