<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; max-width: 720px; }
    h1 { font-size: 1.2em; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #888; flex: none; }
    .ok { background: #2e9e4f; } .degraded { background: #d9a021; } .fault { background: #d64545; } .offline { background: #888; }
    table { border-collapse: collapse; margin: 8px 0; }
    td { padding: 4px 8px; border-bottom: 1px solid #8884; vertical-align: top; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span><span id="message">…</span></h1>
  <table><tbody id="subsystems"></tbody></table>
  <div class="row">
    <label><input type="checkbox" data-fault="camera_unplugged"> Unplug the camera</label>
    <label><input type="checkbox" data-fault="stage_alarm"> Raise a stage alarm</label>
    <label><input type="checkbox" data-fault="scratch_full"> Fill the scratch disk</label>
    <button id="home">Home the stage</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
