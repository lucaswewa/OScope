<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stitched mosaic</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0 auto; padding: 16px; max-width: 1100px; }
    img { max-width: 100%; display: block; border: 1px solid #8884; background: #000; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
    dt { color: #888; }
    .bad { color: #d33; }
  </style>
</head>
<body>
  <h1>Stitched mosaic</h1>
  <p id="message">Looking for the newest stitch of the <code>ex-stitch</code> project…</p>
  <dl id="report"></dl>
  <img id="mosaic" alt="The mosaic's thumbnail">
  <script src="app.js"></script>
</body>
</html>
