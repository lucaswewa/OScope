<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two clients</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; max-width: 640px; }
    h1 { font-size: 1.2em; margin: 0 0 8px; }
    form, .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
    output { font-variant-numeric: tabular-nums; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Two clients <span id="message"></span></h1>
  <form id="login">
    <label>Name <input id="name" value="alice" autocomplete="username"></label>
    <label>Password <input id="password" type="password" autocomplete="current-password"></label>
    <button>Log in</button>
  </form>
  <div id="session" hidden>
    <p>Logged in as <b id="me"></b>. Control: <b id="holder">no one</b><span id="requests"></span></p>
    <p>The stage: <output id="position">…</output></p>
    <div class="row">
      <button id="acquire">Take control</button>
      <button id="request">Ask for control</button>
      <button id="release">Give it up</button>
      <label>Hand over to <select id="to"></select></label>
      <button id="hand">Hand over</button>
    </div>
    <div class="row">
      <button id="home">Home</button>
      <button data-dx="-100">← 100 µm</button>
      <button data-dx="100">100 µm →</button>
      <button id="logout">Log out</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
