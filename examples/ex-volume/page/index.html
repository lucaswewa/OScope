<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volume</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
    body { margin: 0; padding: 12px 16px; display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; box-sizing: border-box; gap: 8px; }
    h1 { font-size: 1.2em; margin: 0; }
    #controls { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
    #controls label { display: flex; gap: 6px; align-items: center; }
    #view { position: relative; min-height: 300px; background: #000; border: 1px solid #8884; }
    #brick { font-variant-numeric: tabular-nums; color: #888; }
    .bad { color: #d33; }
  </style>
</head>
<body>
  <h1>Volume <span id="message">: looking for the newest z-stack…</span></h1>
  <div id="controls">
    <label>Drawn as
      <select id="mode">
        <option value="mip">a maximum intensity projection</option>
        <option value="composite">composited</option>
      </select>
    </label>
    <label>Black <input id="low" type="range" min="0" max="254"></label>
    <label>White <input id="high" type="range" min="1" max="255"></label>
    <label>Depth × <input id="depth" type="range" min="1" max="8" step="0.5" value="1"></label>
  </div>
  <div id="view"></div>
  <div id="brick">Drag to turn it, scroll to zoom.</div>
  <script src="/vendor/vtk.js-38.0.4/vtk.js"></script>
  <script src="app.js"></script>
</body>
</html>
