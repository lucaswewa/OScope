# A stub Python extension (P46): where a learned cell segmenter, cellpose or
# StarDist, plugs in, as a node. OScope makes its environment with uv when
# it is installed. Neither library is a dependency: install one into the
# environment to use it, under its own licence.
id = "org.oscope.examples.cells-stub"
name = "Cell segmentation stub"
version = "0.1.0"
license = "MIT"
publisher = "OScope examples"
description = "A stub: nuclei segmented by cellpose or StarDist if either is installed, or a stand-in mask of the pixels above the image's mean."
oscope-api = "^1.0"
kind = "python"

[provides]
nodes = ["example.cells_segment"]

[python]
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2.0"]
entry = "cells_stub"
