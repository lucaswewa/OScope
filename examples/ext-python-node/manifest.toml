# A sample Python extension (P26, ADR-0020): total-variation denoising, from
# scikit-image, and a panel for it (P27). OScope makes its environment with
# uv when it is installed.
id = "org.oscope.examples.tv-denoise"
name = "Total-variation denoising"
version = "0.1.0"
license = "MIT"
publisher = "OScope examples"
description = "A sample Python extension: scikit-image's total-variation denoising."
oscope-api = "^1.0"
kind = "python"
# Its panel's document (ADR-0036).
assets = ["panels/example.denoise_tv.json"]

[provides]
nodes = ["example.denoise_tv"]
panels = ["example.denoise_tv"]

[python]
requires-python = ">=3.12,<3.15"
dependencies = ["scikit-image>=0.25"]
entry = "tv_denoise"
