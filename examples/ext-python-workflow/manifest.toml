# A sample Python extension (P36, ADR-0025): a scan workflow that plans a
# square spiral of tiles out from a centre. OScope makes its environment
# with uv when it is installed.
id = "org.oscope.examples.spiral"
name = "Spiral scan"
version = "0.1.0"
license = "MIT"
publisher = "OScope examples"
description = "A sample Python scan workflow: tiles in a square spiral out from a centre, a ring at a time."
oscope-api = "^1.0"
kind = "python"

[provides]
workflows = ["example.spiral"]

[python]
requires-python = ">=3.12,<3.15"
entry = "spiral"
