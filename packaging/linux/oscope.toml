# OScope's configuration for the systemd service: absolute folders, in the
# service's own state folder, the only one it may write.

version = 2

[network]
address = "127.0.0.1"
port = 8210

[storage]
data_root = "/var/lib/oscope/data"
scratch_root = "/var/lib/oscope/scratch"

[shm]
# The desktop app's preview ring, /dev/shm/oscope-preview.
enabled = true
